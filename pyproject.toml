[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trace-atlas"
version = "0.1.0"
description = "Evidence-grounded news research on a shared Deep Agents harness"
requires-python = ">=3.12,<3.14"
dependencies = [
  "deepagents==0.7.35",
  "langgraph-checkpoint-sqlite==3.1.3",
  "httpx>=0.28,<1",
  "python-dotenv>=1,<2",
  "langchain-deepseek>=1.1.1",
  "beautifulsoup4>=4.12,<5",
]

[project.scripts]
news-agent = "news_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["src/news_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
